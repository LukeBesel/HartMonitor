<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>HartMonitor — Manufacturing Execution System</title>
    <meta name="description" content="HartMonitor is the modern manufacturing execution system for the shop floor. Build no-code work instructions, schedule jobs, track OEE, manage quality, and put real-time data in every operator's hands." />
    <meta property="og:title" content="HartMonitor — Manufacturing Execution System" />
    <meta property="og:description" content="Run your shop floor like the future. Guided work instructions, scheduling, OEE, quality, and a mobile operator portal — all in one platform." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/shot-dashboard.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Paints the saved appearance before first paint, so a returning dark-mode
      // user never sees a white flash. One rule, stated in two places: a stored
      // preference decides, and with nothing stored HartMonitor is light.
      // ThemeContext.loadDarkMode() implements the identical rule — if the two
      // ever disagree, React undoes this class right after first paint and the
      // page visibly changes colour under the visitor.
      try {
        if (localStorage.getItem('hm_dark_mode') === 'true') {
          document.documentElement.classList.add('dark');
        }
        // The tenant's brand colours, for the same reason. These are applied by
        // a React effect too, which runs AFTER first paint — so a company on any
        // non-default theme got 25-75ms of HartMonitor's own pink and midnight
        // sidebar on every cold load, then a visible snap to their own brand.
        // Only the raw stored values are set here; ThemeContext derives the
        // contrast-safe --accent family from them a moment later, and setting
        // the same properties again is a no-op when they already match.
        var savedTheme = localStorage.getItem('hm_theme');
        if (savedTheme) {
          var t = JSON.parse(savedTheme);
          var root = document.documentElement;
          var vars = {
            '--accent': t.accent, '--accent-dark': t.accentDark,
            '--accent-light': t.accentLight, '--sidebar-bg': t.sidebarBg,
            '--secondary': t.secondary || t.accent,
            '--secondary-dark': t.secondaryDark || t.accentDark,
            '--secondary-light': t.secondaryLight || t.accentLight,
          };
          for (var k in vars) if (vars[k]) root.style.setProperty(k, vars[k]);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
